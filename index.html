ut[type=file]{display:none}.viewer{position:fixed;inset:0;background:#090a0c;z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}.viewer-head{height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}.viewer-brand{background:none;border:0;color:var(--text);font-size:17px;font-weight:750;letter-spacing:.08em;padding:8px 4px}.counter{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;text-align:center}.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:19px}.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;will-change:transform}.viewer-foot{padding:10px 0 calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}.viewer-controls{justify-content:center}.zoom-label{font-size:11px;color:var(--muted);min-width:36px;text-align:center}.hint{font-size:10px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e7eaf0;color:#151619;padding:10px 14px;border-radius:99px;font-size:11px;z-index:30;box-shadow:0 8px 30px #0008}@media(min-width:560px){.app{padding:22px}.grid{gap:9px}.tile{border-radius:8px}}
</style></head><body><main class="app"><header><div><button class="brand" id="brandHome">真写</button><div class="subtitle">MIRROR PHOTO GALLERY · FOR IPHONE</div></div><div class="actions"><button class="btn primary" id="photoBtn">写真を追加</button><input id="photoInput" type="file" accept="image/*,.heic,.heif,.avif,.jpg,.jpeg,.png,.webp" multiple></div></header><div class="status"><span id="countLabel">写真を読み込み中…</span><span>iPhone専用 · 端末内保存</span></div><div class="toolbar"><select id="orderSelect" aria-label="表示順"><option value="new">新しい順</option><option value="old">古い順</option><option value="shuffle">ランダム順</option></select><button class="btn" id="shuffleBtn" type="button">🎲 ランダム表示</button><span class="spacer"></span><button class="btn" id="flipBtn">一覧：反転 ON</button><button class="btn" id="clearBtn" disabled>全削除</button></div><section class="grid" id="grid" style="--cols:3"></section><p class="hint" style="text-align:center;margin:8px 0 12px">一覧でピンチイン：表示枚数を増やす ／ ピンチアウト：表示枚数を減らす</p><section class="empty" id="empty"><strong>写真を選択してください</strong>「写真を追加」から写真ライブラリを開き、練習に使う写真を選べます。<br><span style="font-size:11px">読み込んだ写真はこのiPhoneの真写内に保存されます。</span></section></main><section class="viewer hidden" id="viewer"><div class="viewer-head"><button class="iconbtn" id="closeViewer" aria-label="閉じる">×</button><button class="viewer-brand" id="viewerHome">真写</button><span class="counter" id="viewerCounter"></span><button class="iconbtn" id="prevBtn" aria-label="前の写真">‹</button><button class="iconbtn" id="nextBtn" aria-label="次の写真">›</button></div><div class="viewer-stage" id="stage"><img id="largeImage" alt="選択した写真"></div><div class="viewer-foot"><div class="viewer-controls"><button class="btn" id="viewerFlip">水平反転：ON</button><button class="btn" id="zoomOut">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="btn" id="zoomReset">100%</button><button class="btn" id="zoomIn">＋</button><button class="btn" id="downloadBtn">共有・保存</button></div><div class="hint">左右スワイプ：写真切替　／　ピンチ：拡大・縮小</div></div></section><div class="toast hidden" id="toast"></div><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const DB_NAME='shinsha-iphone-library', LEGACY_DB='shinsha-local-library', STORE='photos';
let db=null, photos=[], order=[], currentPosition=0, listFlip=true, viewerFlip=true, zoom=1, offsetX=0, offsetY=0, toastTimer=null, dragDepth=0, initialization=Promise.resolve(), gridCols=Math.max(2,Math.min(6,Number(localStorage.getItem('shinsha-ios-grid-cols')||3))), gridPinchStartDistance=0, gridPinchStartCols=3;
const grid=$('grid'),viewer=$('viewer'),stage=$('stage'),large=$('largeImage');
const toast=message=>{const node=$('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),2800)};
const currentRecord=()=>photos[order[currentPosition]];
const safeName=name=>(name||'shinsha-photo').replace(/[\\/:*?"<>|]/g,'_');
const IMAGE_MIME_BY_EXT={jpg:'image/jpeg',jpeg:'image/jpeg',jpe:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',tif:'image/tiff',tiff:'image/tiff',heic:'image/heic',heif:'image/heif',heix:'image/heic',heicx:'image/heic',avif:'image/avif',avis:'image/avif'};
function imageMimeFromName(name){const match=String(name||'').toLowerCase().match(/\.([a-z0-9]+)$/);return match?IMAGE_MIME_BY_EXT[match[1]]||'':''}
function imageMimeForRecord(record){const typed=String(record?.mime||record?.blob?.type||'').toLowerCase();return typed.startsWith('image/')?typed:imageMimeFromName(record?.name)}
async function detectImageMime(file){
  const typed=String(file?.type||'').toLowerCase();
  if(typed.startsWith('image/'))return typed;
  const byName=imageMimeFromName(file?.name||file?.webkitRelativePath);
  if(byName)return byName;
  try{
    const bytes=new Uint8Array(await file.slice(0,32).arrayBuffer());
    if(bytes.length>=3&&bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)return 'image/jpeg';
    if(bytes.length>=8&&bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)return 'image/png';
    if(bytes.length>=6&&/^GIF8[79]a$/.test(String.fromCharCode(...bytes.slice(0,6))))return 'image/gif';
    if(bytes.length>=12&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')return 'image/webp';
    if(bytes.length>=2&&bytes[0]===0x42&&bytes[1]===0x4d)return 'image/bmp';
    if(bytes.length>=4&&((bytes[0]===0x49&&bytes[1]===0x49&&bytes[2]===0x2a&&bytes[3]===0)||(bytes[0]===0x4d&&bytes[1]===0x4d&&bytes[2]===0&&bytes[3]===0x2a)))return 'image/tiff';
    if(bytes.length>=12&&String.fromCharCode(...bytes.slice(4,8))==='ftyp'){
      const brand=String.fromCharCode(...bytes.slice(8,12)).toLowerCase();
      if(/hei[cfxv]|mif1|msf1/.test(brand))return 'image/heic';
      if(/avi[fs]/.test(brand))return 'image/avif';
    }
  }catch(error){console.warn('Could not inspect selected image',error)}
  return '';
}
const imageBlob=(blob,mime)=>blob?.type?.startsWith('image/')?blob:new Blob([blob],{type:mime||'application/octet-stream'});
const shuffle=list=>{const result=[...list];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result};
function updateEmpty(){const has=photos.length>0;$('empty').classList.toggle('hidden',has);grid.classList.toggle('hidden',!has);$('countLabel').textContent=has?`${photos.length.toLocaleString()} 枚の写真`:'写真はまだありません';$('clearBtn').disabled=!has;}
function applyOrder(){const ids=photos.map((_,i)=>i);const mode=$('orderSelect').value;order=mode==='shuffle'?shuffle(ids):ids.sort((a,b)=>{const delta=(photos[a].added||0)-(photos[b].added||0);return mode==='old'?delta:-delta});currentPosition=0;renderGrid();}
function renderGrid(){grid.innerHTML='';grid.style.setProperty('--cols',String(gridCols));order.forEach((photoIndex,position)=>{const record=photos[photoIndex];const card=document.createElement('button');card.className='tile';card.type='button';card.title=record.name;const img=document.createElement('img');img.src=record.url;img.alt=record.name;img.style.transform=listFlip?'scaleX(-1)':'none';card.append(img);card.addEventListener('click',()=>openViewer(position));grid.append(card)});updateEmpty();}
function setGridCols(value){gridCols=Math.max(2,Math.min(6,value));localStorage.setItem('shinsha-ios-grid-cols',String(gridCols));renderGrid();toast(`一覧：${gridCols}列`)}
function gridTouchDistance(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy)}
grid.addEventListener('touchstart',event=>{if(event.touches.length===2){gridPinchStartDistance=touchDistance(event.touches);gridPinchStartCols=gridCols}},{passive:true});
grid.addEventListener('touchmove',event=>{if(event.touches.length!==2||!gridPinchStartDistance)return;event.preventDefault();const distance=gridTouchDistance(event.touches),delta=distance-gridPinchStartDistance;const steps=Math.trunc(Math.abs(delta)/42);if(steps){const next=gridPinchStartCols+(delta<0?steps:-steps);const bounded=Math.max(2,Math.min(6,next));if(bounded!==gridCols){gridCols=bounded;localStorage.setItem('shinsha-ios-grid-cols',String(gridCols));grid.style.setProperty('--cols',String(gridCols));$('countLabel').textContent=`${photos.length.toLocaleString()} 枚の写真 · ${gridCols}列`}}},{passive:false});
grid.addEventListener('touchend',event=>{if(event.touches.length<2)gridPinchStartDistance=0},{passive:true});
grid.addEventListener('touchcancel',()=>{gridPinchStartDistance=0},{passive:true});

function openDatabase(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const database=request.result;if(!database.objectStoreNames.contains(STORE))database.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('保存領域を開けません'))})}
function getAllRecords(database,name){return new Promise((resolve,reject)=>{if(!database.objectStoreNames.contains(name)){resolve([]);return}const tx=database.transaction(name,'readonly'),request=tx.objectStore(name).getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error||new Error('写真を読み込めません'))})}
function putRecords(records){return new Promise((resolve,reject)=>{if(!records.length){resolve([]);return}const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE),ids=[];records.forEach(record=>{const request=store.add(record);request.onsuccess=()=>ids.push(request.result)});tx.oncomplete=()=>resolve(ids);tx.onerror=()=>reject(tx.error||new Error('保存に失敗しました'));tx.onabort=()=>reject(tx.error||new Error('保存が中断されました'))})}
async function tryLegacyMigration(){
  const flag=`${DB_NAME}:legacy-v11-migrated`;if(localStorage.getItem(flag)==='yes')return;
  try{
    if(indexedDB.databases){const known=await indexedDB.databases();if(!known.some(item=>item.name===LEGACY_DB)){localStorage.setItem(flag,'yes');return}}
    const request=indexedDB.open(LEGACY_DB);
    const legacy=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onupgradeneeded=()=>{request.transaction.abort()}}).catch(()=>null);
    if(!legacy){localStorage.setItem(flag,'yes');return}
    const records=await getAllRecords(legacy,STORE);legacy.close();
    const copies=records.map(record=>{const name=record.name||'写真',blob=record.blob||record.file,mime=imageMimeForRecord({name,blob});return{name,added:record.added||Date.now(),mime,blob:mime?imageBlob(blob,mime):blob}}).filter(record=>record.blob&&record.mime);
    if(copies.length){await putRecords(copies);toast(`以前の真写から ${copies.length} 枚を引き継ぎました`)}
    localStorage.setItem(flag,'yes');
  }catch(error){console.warn('Legacy migration skipped',error)}
}
async function init(){
  try{db=await openDatabase();await tryLegacyMigration();const records=await getAllRecords(db,STORE);records.sort((a,b)=>(a.added||0)-(b.added||0));photos=records.map(r=>{const mime=imageMimeForRecord(r);if(!r.blob||!mime)return null;const blob=imageBlob(r.blob,mime);return{...r,mime,blob,url:URL.createObjectURL(blob)}}).filter(Boolean);if(navigator.storage?.persist){try{await navigator.storage.persist()}catch{}}
  }catch(error){console.error(error);db=null;toast('端末保存を利用できません。読み込んだ写真は一時表示になります')}
  applyOrder();
}
async function addFiles(fileList){const selectedFiles=Array.from(fileList||[]);await initialization;const files=[];for(const file of selectedFiles){const mime=await detectImageMime(file);if(mime)files.push({file,mime})}if(!files.length){toast(selectedFiles.length?'画像を認識できませんでした。別の写真を選択してください':'写真が選択されていません');return}
  const base=Date.now();const records=files.map(({file,mime},index)=>({name:file.webkitRelativePath||file.name||`写真 ${index+1}`,added:base+index,mime,blob:imageBlob(file,mime)}));
  if(db){try{const ids=await putRecords(records);records.forEach((record,index)=>photos.push({...record,id:ids[index],url:URL.createObjectURL(record.blob)}));}catch(error){console.error(error);toast('保存できませんでした。端末の空き容量を確認してください');return}}
  else records.forEach(record=>photos.push({...record,url:URL.createObjectURL(record.blob)}));
  applyOrder();toast(db?`${files.length} 枚を端末内に保存しました`:`${files.length} 枚を一時読み込みしました`);
}
function resetZoom(){zoom=1;offsetX=0;offsetY=0;paintImage()}
function paintImage(){const flip=viewerFlip?-1:1;large.style.transform=`translate3d(${offsetX}px,${offsetY}px,0) scaleX(${flip}) scale(${zoom})`;const label=$('zoomLabel');if(label)label.textContent=`${Math.round(zoom*100)}%`}
function openViewer(position){currentPosition=position;viewerFlip=true;resetZoom();renderViewer();viewer.classList.remove('hidden');document.body.classList.add('viewing');}
function renderViewer(){const record=currentRecord();if(!record)return;large.src=record.url;large.alt=record.name;paintImage();$('viewerCounter').textContent=`${currentPosition+1} / ${order.length}　${record.name}`;$('viewerFlip').textContent=`水平反転：${viewerFlip?'ON':'OFF'}`;$('prevBtn').disabled=order.length<2;$('nextBtn').disabled=order.length<2;}
function closeViewer(){viewer.classList.add('hidden');document.body.classList.remove('viewing')}
function move(delta){if(!order.length)return;currentPosition=(currentPosition+delta+order.length)%order.length;resetZoom();renderViewer()}
function zoomBy(factor){zoom=Math.max(1,Math.min(6,zoom*factor));if(zoom===1){offsetX=0;offsetY=0}paintImage()}
function downloadCurrent(){const record=currentRecord();if(!record)return;const link=document.createElement('a');link.href=record.url;link.download=safeName(record.name);document.body.append(link);link.click();link.remove();toast('元画像の保存を開始しました')}
async function clearLibrary(){if(!photos.length)return;if(!confirm('この真写アプリ内に保存した写真をすべて削除しますか？\n元の写真ファイルは削除されません。'))return;try{if(db)await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});photos.forEach(record=>URL.revokeObjectURL(record.url));photos=[];order=[];closeViewer();renderGrid();toast('このアプリ内の写真を削除しました')}catch(error){console.error(error);toast('削除できませんでした')}}
function goHome(){closeViewer();window.scrollTo({top:0,behavior:'smooth'})}
function renderOrderControls(){$('directionSelect')?.classList.toggle('hidden',$('orderSelect').value==='shuffle')}
$('brandHome').addEventListener('click',goHome);$('viewerHome').addEventListener('click',goHome);$('closeViewer').addEventListener('click',closeViewer);
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));$('viewerFlip').addEventListener('click',()=>{viewerFlip=!viewerFlip;renderViewer()});$('downloadBtn').addEventListener('click',downloadCurrent);$('zoomIn').addEventListener('click',()=>zoomBy(1.25));$('zoomOut').addEventListener('click',()=>zoomBy(.8));$('zoomReset').addEventListener('click',resetZoom);
$('photoBtn').addEventListener('click',()=>$('photoInput').click());$('photoInput').addEventListener('change',event=>{const selected=Array.from(event.currentTarget.files||[]);event.currentTarget.value='';void addFiles(selected)});$('clearBtn').addEventListener('click',clearLibrary);
$('orderSelect').addEventListener('change',()=>{renderOrderControls();applyOrder()});$('shuffleBtn').addEventListener('click',()=>{$('orderSelect').value='shuffle';renderOrderControls();applyOrder();toast('写真をランダムな順番に並べました')});$('directionSelect')?.addEventListener('change',applyOrder);
$('flipBtn')?.addEventListener('click',()=>{listFlip=!listFlip;$('flipBtn').textContent=`一覧：反転 ${listFlip?'ON':'OFF'}`;renderGrid()});
document.addEventListener('keydown',event=>{if(viewer.classList.contains('hidden')){if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='o'){event.preventDefault();$('photoInput').click()}return}if(event.key==='Escape'){closeViewer();return}if(event.key==='ArrowRight'){event.preventDefault();move(1)}if(event.key==='ArrowLeft'){event.preventDefault();move(-1)}if(event.key.toLowerCase()==='f'){viewerFlip=!viewerFlip;renderViewer()}if(event.key==='+'||event.key==='=')zoomBy(1.2);if(event.key==='-')zoomBy(.83);if(event.key==='0')resetZoom()});
function installSW(){if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service worker registration failed',error)))}

// iPhone: touch-first viewer with swipe navigation and pinch zoom.
let touchMode='',touchStartX=0,touchStartY=0,lastTouchX=0,lastTouchY=0,pinchStartDistance=0,pinchStartZoom=1,pinchStartOffsetX=0,pinchStartOffsetY=0,pinchStartMidX=0,pinchStartMidY=0;
const touchDistance=touches=>Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
const touchMidpoint=touches=>({x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2});
stage.addEventListener('touchstart',event=>{if(event.touches.length===2){touchMode='pinch';gridPinchStartDistance=gridTouchDistance(event.touches);pinchStartZoom=zoom;pinchStartOffsetX=offsetX;pinchStartOffsetY=offsetY;const mid=touchMidpoint(event.touches),rect=stage.getBoundingClientRect();pinchStartMidX=mid.x-(rect.left+rect.width/2);pinchStartMidY=mid.y-(rect.top+rect.height/2)}else if(event.touches.length===1){const t=event.touches[0];touchStartX=lastTouchX=t.clientX;touchStartY=lastTouchY=t.clientY;touchMode=zoom>1?'pan':'swipe'}},{passive:true});
stage.addEventListener('touchmove',event=>{
 if(touchMode==='pinch'&&event.touches.length===2){event.preventDefault();const next=Math.max(1,Math.min(6,pinchStartZoom*touchDistance(event.touches)/Math.max(1,pinchStartDistance)));const mid=touchMidpoint(event.touches),rect=stage.getBoundingClientRect();const mx=mid.x-(rect.left+rect.width/2),my=mid.y-(rect.top+rect.height/2);const startMid=touchMidpoint(event.touches);const imageX=(pinchStartMidX-pinchStartOffsetX)/pinchStartZoom,imageY=(pinchStartMidY-pinchStartOffsetY)/pinchStartZoom;zoom=next;offsetX=mx-imageX*zoom;offsetY=my-imageY*zoom;if(zoom===1){offsetX=0;offsetY=0}paintImage()}
 else if(touchMode==='pan'&&event.touches.length===1){event.preventDefault();const t=event.touches[0];offsetX+=t.clientX-lastTouchX;offsetY+=t.clientY-lastTouchY;lastTouchX=t.clientX;lastTouchY=t.clientY;paintImage()}
},{passive:false});
